# A one-shot in-cluster run of devicesim or verify. __NAME__, __CMD__ and
# __ARGS__ are filled in by scripts/kind_failover.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: eip:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/__CMD__"]
          args: [__ARGS__]
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
